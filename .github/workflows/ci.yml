name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # hatch-vcs derives the version from tags
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m mypy
      - run: python -m pytest
      - run: python scripts/budgets.py

  # The tier that needs real external programs. It asserts the marked tests
  # actually ran: a filter that matches nothing exits zero, so a job meant to
  # run this tier and running none of it would otherwise report green.
  with-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # flac carries metaflac; beets arrives as a dependency of the package.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg flac
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q --require=needs_ffmpeg --require=needs_beets

  # Python's failure mode is not a compile error, it is a wheel that will not
  # install. Build it, check it, install it clean, and run the binary.
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: install the wheel into a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/ripdoctor --version
          /tmp/clean/bin/ripdoctor doctor --json > /dev/null || true
      # The install is allowed beets and whatever beets itself needs. What it
      # is not allowed is a dependency of this project's own that nobody
      # decided on - scripts/budgets.py holds that line against pyproject.toml,
      # and this checks the thing pip actually resolved.
      - name: the install pulls in what it says it does
        run: |
          /tmp/clean/bin/pip show ripdoctor | grep -q '^Requires: beets$' || {
            /tmp/clean/bin/pip show ripdoctor; echo "unexpected requirements"; exit 1; }
          /tmp/clean/bin/beet version
