[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "ripdoctor"
description = "Capture a vinyl side, find the track boundaries, cut them where you want them."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Bryan Speelman" }]
keywords = ["vinyl", "audio", "flac", "track-splitting", "digitization"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
  "Topic :: Multimedia :: Sound/Audio :: Editors",
]
dynamic = ["version"]

# Deliberately empty, and enforced by scripts/budgets.py.
# Python 3.11 is the floor because tomllib is in the stdlib from 3.11, which is
# what lets the config layer read TOML at zero dependency cost. See ADR-004.
dependencies = []

[project.optional-dependencies]
beets = ["beets>=2.0"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "hypothesis>=6"]

[project.scripts]
ripdoctor = "ripdoctor.cli:main"

[project.urls]
Homepage = "https://github.com/bspeelm/ripdoctor"
Source = "https://github.com/bspeelm/ripdoctor"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["ripdoctor"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# S (bandit) is deliberate: this app joins untrusted paths and shells out to
# ffmpeg and friends. Every subprocess call must be an annotated decision.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
# assert is the point, and a seeded PRNG is how deterministic test signals are
# built - neither is a security concern in a test.
# Test credentials are literal by necessity; S105-S107 flag every one.
"tests/*" = ["S101", "S311", "S105", "S106", "S107"]
# A transliteration table is definitionally a table of confusable characters;
# flagging them is the rule working against the file's whole purpose.
"ripdoctor/core/naming.py" = ["RUF001"]

[tool.mypy]
python_version = "3.11"
# Strict on the pure layer only. It is the published asset, and strictness there
# immediately catches the "envelope is [(t, dB)] here and [dB] there" drift that
# already exists between refit2.gaps() and analysis.gaps() in the original.
files = ["ripdoctor"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ripdoctor.core.*"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -W error"
markers = [
  "needs_ffmpeg: requires a real ffmpeg binary on PATH",
  "needs_hardware: requires a real capture device; never run in CI",
]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
